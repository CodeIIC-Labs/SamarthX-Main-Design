<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 720" width="1200" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="lidGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="176" y="64" width="848" height="530" rx="8"/>
    </clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="600" cy="660" rx="520" ry="22" fill="url(#shadow)"/>

  <!-- lid -->
  <rect x="150" y="40" width="900" height="580" rx="28" fill="url(#lidGrad)"/>

  <!-- screen placeholder (dikhega jab tak image na lagayein) -->
  <g clip-path="url(#screenClip)">
    <rect x="176" y="64" width="848" height="530" fill="#f3f4f6"/>
    <g fill="none" stroke="#9ca3af" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="540" y="280" width="120" height="90" rx="10"/>
      <circle cx="570" cy="308" r="9"/>
      <path d="M548 362 L590 326 L616 348 L634 334 L652 352"/>
    </g>
    <text x="600" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#6b7280">Apni image yahan lagayein</text>

    <!-- ===== YAHAN APNI IMAGE LAGAYEIN =====
         href ko apni image ke path ya base64 data URI se badal dein -->
    <image href="your-image.jpg" xlink:href="your-image.jpg"
           x="176" y="64" width="848" height="530"
           preserveAspectRatio="xMidYMid slice"/>
    <!-- ===================================== -->

    <rect x="176" y="64" width="848" height="530" fill="url(#glare)"/>
  </g>

  <!-- camera -->
  <circle cx="600" cy="52" r="3.5" fill="#0b1220"/>

  <!-- base -->
  <path d="M70 620 H1130 L1150 636 Q1152 650 1138 650 H62 Q48 650 50 636 Z" fill="url(#baseGrad)"/>
  <path d="M520 620 H680 V626 Q680 632 674 632 H526 Q520 632 520 626 Z" fill="#6b7280" opacity="0.55"/>
</svg>
