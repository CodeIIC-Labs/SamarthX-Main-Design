<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 420 840" width="420" height="840" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="38" y="38" width="344" height="764" rx="42"/>
    </clipPath>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="210" cy="822" rx="150" ry="12" fill="url(#shadow)"/>

  <!-- side buttons -->
  <rect x="16" y="170" width="6" height="56" rx="3" fill="#1f2937"/>
  <rect x="16" y="250" width="6" height="90" rx="3" fill="#1f2937"/>
  <rect x="16" y="360" width="6" height="90" rx="3" fill="#1f2937"/>
  <rect x="398" y="260" width="6" height="120" rx="3" fill="#1f2937"/>

  <!-- body -->
  <rect x="20" y="20" width="380" height="800" rx="58" fill="url(#bodyGrad)"/>
  <rect x="26" y="26" width="368" height="788" rx="52" fill="#050912"/>

  <!-- screen placeholder (dikhega jab tak image na lagayein) -->
  <g clip-path="url(#screenClip)">
    <rect x="38" y="38" width="344" height="764" fill="#f3f4f6"/>
    <g fill="none" stroke="#9ca3af" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="150" y="380" width="120" height="90" rx="10"/>
      <circle cx="180" cy="408" r="9"/>
      <path d="M158 462 L200 426 L226 448 L244 434 L262 452"/>
    </g>
    <text x="210" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">Apni image yahan lagayein</text>

    <!-- ===== YAHAN APNI IMAGE LAGAYEIN =====
         href ko apni image ke path ya base64 data URI se badal dein -->
    <image href="your-image.jpg" xlink:href="your-image.jpg"
           x="38" y="38" width="344" height="764"
           preserveAspectRatio="xMidYMid slice"/>
    <!-- ===================================== -->

    <rect x="38" y="38" width="344" height="764" fill="url(#glare)"/>
  </g>

  <!-- dynamic island -->
  <rect x="158" y="52" width="104" height="30" rx="15" fill="#000"/>
  <circle cx="244" cy="67" r="5" fill="#0f172a"/>

  <!-- home indicator -->
  <rect x="150" y="786" width="120" height="5" rx="2.5" fill="#ffffff" opacity="0.85"/>
</svg>
